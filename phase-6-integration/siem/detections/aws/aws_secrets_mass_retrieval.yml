title: AWS Secrets Manager Mass Retrieval
id: 6f3b0e0a-1c2d-4f7a-9b11-0a1b2c3d4e03
status: experimental
description: One principal retrieves many distinct secrets in a short window — credential harvesting after compromise.
author: Cloud/DevOps Platform
date: 2026/10/22
tags:
  - attack.credential_access
  - attack.t1555
  - kf.id.AWS-CRED-002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName:
      - GetSecretValue
      - BatchGetSecretValue
  filter_lambda_runtime:
    userIdentity.invokedBy: lambda.amazonaws.com
  condition: selection and not filter_lambda_runtime | count(requestParameters.secretId) by userIdentity.arn > 10
timeframe: 10m
falsepositives:
  - Rotation Lambdas, deployment pipelines that read many secrets (allow-list by role ARN)
level: high
