title: AWS Root Account Usage
id: 6f3b0e0a-1c2d-4f7a-9b11-0a1b2c3d4e01
status: stable
description: Any API call or console sign-in by the root user of any member account. Root is denied by SCP in member accounts, so even attempts are suspicious.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
author: Cloud/DevOps Platform
date: 2026/10/22
tags:
  - attack.privilege_escalation
  - attack.t1078.004
  - kf.id.AWS-IAM-001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.type: Root
  filter_service_events:
    eventType: AwsServiceEvent
  filter_invoked_by:
    userIdentity.invokedBy|exists: true
  condition: selection and not filter_service_events and not filter_invoked_by
falsepositives:
  - Documented root-only tasks performed under change control (account closure, support plan change)
level: critical
