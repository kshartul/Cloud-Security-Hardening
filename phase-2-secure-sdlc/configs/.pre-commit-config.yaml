# Distributed to every repo (P2.4). Install: pip install pre-commit && pre-commit install
# Pin revs; Renovate/Dependabot bumps them monthly.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.95.0
    hooks:
      - id: semgrep
        args: ["--config", "p/secrets", "--config", "p/python", "--error", "--skip-unknown-extensions"]

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.300
    hooks:
      - id: checkov
        args: ["--quiet", "--compact", "--framework", "terraform,serverless,cloudformation"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-lll", "-iii", "-x", "tests"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
